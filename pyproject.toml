[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelflow"
version = "0.1.0"
description = "AI-assisted security event triage and response platform (local development build)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "SQLAlchemy>=2.0.30,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "PyJWT>=2.10,<3.0",
    "argon2-cffi>=23.1,<26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "httpx2>=2.14,<3.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<3.0",
    # Used by tests/test_deploy_config.py to inspect compose.yaml without Docker.
    "PyYAML>=6.0,<7.0",
]

[project.scripts]
sentinelflow-import = "sentinelflow.cli.import_events:main"
sentinelflow-create-user = "sentinelflow.cli.create_user:main"
sentinelflow-investigate = "sentinelflow.cli.investigate:main"
sentinelflow-doctor = "sentinelflow.cli.doctor:main"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src/sentinelflow", "tests"]
# Third-party stubs are incomplete (psycopg, FastAPI internals); silence the
# missing-stub noise rather than pinning stub packages that drift.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# Pinned explicitly: ruff's defaults change between releases, and a check that
# silently starts flagging new rules is not a stable check.
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    # FastAPI's dependency injection is a call in a default argument, by design.
    "B008",
    # Line length is the formatter's job; the linter does not double-report it.
    "E501",
    # The docs and messages are written in Chinese; full-width punctuation in
    # strings is intended, not an ambiguous-character bug.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["sentinelflow"]

[tool.ruff.format]
quote-style = "double"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires a running PostgreSQL instance",
]
