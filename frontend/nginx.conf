# Serves the built console and proxies the API on the same origin.
#
# Same origin matters: the SPA calls '/api/v1' relative to wherever it is
# served, so no CORS configuration is needed and no API base URL has to be
# baked into the bundle at build time.

upstream sentinelflow_api {
    # compose service name; resolved by Docker's embedded DNS.
    server api:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API body limit is enforced by the app (MAX_REQUEST_BODY_BYTES); nginx
    # must not reject first, or the app's 413 message would never be seen.
    client_max_body_size 8m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Container health, independent of the API.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Proxied so the SPA and the probes share one origin with the API.
    location /api/ {
        proxy_pass http://sentinelflow_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://sentinelflow_api;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://sentinelflow_api;
        access_log off;
    }

    # Hashed assets never change; cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Client-side routes: /alerts/<uuid> is not a file on disk.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must not be cached, or a new deploy keeps serving the old shell.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
