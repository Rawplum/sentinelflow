# SentinelFlow local stack: PostgreSQL, a one-shot migration job, the API and
# the console.
#
#   cp .env.example .env     # then replace every CHANGE_ME
#   docker compose up -d --build
#   open http://127.0.0.1:8080
#
# Everything binds to 127.0.0.1 on purpose. This stack has no TLS, so it must
# not be published to the internet; put a reverse proxy with TLS in front if you
# ever need remote access.

name: sentinelflow

# Shared by `migrate` and `api`. One anchor means the schema is applied by
# exactly the configuration that will serve it.
x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-production}
  DEBUG: "false"
  # No default on purpose: compose refuses to start without a real secret.
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env - generate one, do not reuse}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  JWT_ISSUER: ${JWT_ISSUER:-sentinelflow}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-sentinelflow-api}
  # Built here rather than read from .env: inside compose the API talks to
  # `db:5432`, while a developer running the API on the host uses 127.0.0.1.
  # One .env cannot hold both, so only the pieces are shared.
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sentinelflow}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-sentinelflow}
  MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-5242880}
  # Agent settings. Leave LLM_* empty to disable the agent: the API keeps
  # working and POST /alerts/{id}/investigations returns 503.
  LLM_PROVIDER: ${LLM_PROVIDER:-}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_API_BASE: ${LLM_API_BASE:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
  AGENT_MAX_ROUNDS: ${AGENT_MAX_ROUNDS:-5}
  AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-8}
  AGENT_TOOL_TIMEOUT_SECONDS: ${AGENT_TOOL_TIMEOUT_SECONDS:-5}
  AGENT_MAX_RUNTIME_SECONDS: ${AGENT_MAX_RUNTIME_SECONDS:-180}
  AGENT_LEASE_SECONDS: ${AGENT_LEASE_SECONDS:-240}
  AGENT_MAX_ATTEMPTS: ${AGENT_MAX_ATTEMPTS:-2}
  AGENT_RETRY_BACKOFF_SECONDS: ${AGENT_RETRY_BACKOFF_SECONDS:-5}
  AGENT_MAX_PENDING: ${AGENT_MAX_PENDING:-50}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sentinelflow}
      POSTGRES_USER: ${POSTGRES_USER:-sentinelflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      # Local development only: never expose the database on all interfaces.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Named volume: `docker compose down` keeps data, `down -v` deletes it.
      - sentinelflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentinelflow-api:local
    # One-shot: apply the schema, then exit. `api` waits for this to succeed.
    command: ["alembic", "upgrade", "head"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    # Never restart a failed migration: a crash loop would hide the error.
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentinelflow-api:local
    restart: unless-stopped
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      # Readiness, not liveness: this is what gates the console container.
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              ok = urllib.request.urlopen("http://127.0.0.1:8000/health/ready", timeout=4).status == 200
          except Exception:
              ok = False
          sys.exit(0 if ok else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Give the queue worker time to stop cleanly on SIGTERM.
    stop_grace_period: 30s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: sentinelflow-web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sentinelflow_pgdata:
